[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ec523-road-refinement"
version = "0.1.0"
description = "Temporary baseline, recurrent road refiner, and midway submission tools"
requires-python = ">=3.12"
dependencies = [
    "torch==2.6.0", "torchvision==0.21.0",
    "segmentation-models-pytorch==0.5.0", "timm==1.0.15",
    "huggingface-hub==0.30.2", "numpy==2.3.5", "Pillow==12.3.0",
    "scipy==1.15.2", "scikit-image==0.25.2", "safetensors==0.5.3",
]

[project.scripts]
road-refinement = "road_refinement.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["road_refinement*", "src*", "project_a*"]
exclude = ["project_a.cli.tests*"]
namespaces = true
