<svg xmlns="http://www.w3.org/2000/svg" width="680" height="750" viewBox="0 0 680 750" font-family="Helvetica, Arial, sans-serif">
<title>Baseline and refiner workflow</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="750" fill="#ffffff"/>

<rect x="70" y="96" width="360" height="99" rx="12" fill="#F1EFE8" fill-opacity="0.5" stroke="#888780" stroke-width="0.75" stroke-dasharray="5 4"/>
<text x="250" y="110" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Baseline (frozen, staff)</text>
<rect x="50" y="255" width="580" height="350" rx="12" fill="#E1F5EE" fill-opacity="0.35" stroke="#0F6E56" stroke-width="0.75" stroke-dasharray="5 4"/>
<text x="610" y="272" font-size="12" fill="#0F6E56" text-anchor="end" dominant-baseline="central">Refiner: repeated K times</text>

<g text-anchor="middle" dominant-baseline="central">
<rect x="270" y="30" width="140" height="44" rx="8" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="340" y="52" font-size="14" font-weight="500" fill="#2C2C2A">Image</text>

<rect x="270" y="120" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="340" y="138" font-size="14" font-weight="500" fill="#444441">Encoder E</text>
<text x="340" y="158" font-size="12" fill="#5F5E5A">image to features</text>
<rect x="90" y="120" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="160" y="138" font-size="14" font-weight="500" fill="#444441">Head H0</text>
<text x="160" y="158" font-size="12" fill="#5F5E5A">features to y0</text>

<rect x="90" y="290" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="160" y="308" font-size="14" font-weight="500" fill="#085041">Ty</text>
<text x="160" y="328" font-size="12" fill="#0F6E56">mask y_t to tokens</text>
<rect x="270" y="290" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="340" y="308" font-size="14" font-weight="500" fill="#085041">Tx</text>
<text x="340" y="328" font-size="12" fill="#0F6E56">features to tokens</text>
<rect x="450" y="290" width="140" height="56" rx="8" fill="#ffffff" stroke="#0F6E56" stroke-width="0.75"/>
<text x="520" y="308" font-size="14" font-weight="500" fill="#085041">State z_t</text>
<text x="520" y="328" font-size="12" fill="#0F6E56">memory (z0 first)</text>

<rect x="270" y="375" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="340" y="393" font-size="14" font-weight="500" fill="#085041">Fuser</text>
<text x="340" y="413" font-size="12" fill="#0F6E56">combine 3 token sets</text>
<rect x="270" y="455" width="140" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="340" y="473" font-size="14" font-weight="500" fill="#712B13">Core</text>
<text x="340" y="493" font-size="12" fill="#993C1D">shared transformer</text>
<rect x="270" y="535" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="340" y="553" font-size="14" font-weight="500" fill="#085041">Head</text>
<text x="340" y="573" font-size="12" fill="#0F6E56">tokens to correction dy</text>

<rect x="250" y="630" width="180" height="56" rx="8" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="340" y="648" font-size="14" font-weight="500" fill="#2C2C2A">y_t+1 = y_t + dy</text>
<text x="340" y="668" font-size="12" fill="#5F5E5A">saved after step K</text>
</g>

<g stroke="#73726c" stroke-width="1.5" fill="none" marker-end="url(#a)">
<line x1="340" y1="74" x2="340" y2="118"/>
<line x1="270" y1="148" x2="232" y2="148"/>
<line x1="340" y1="176" x2="340" y2="288"/>
<line x1="160" y1="176" x2="160" y2="288"/>
<path d="M160 346 L160 403 L268 403"/>
<line x1="340" y1="346" x2="340" y2="373"/>
<path d="M520 346 L520 403 L412 403"/>
<line x1="340" y1="431" x2="340" y2="453"/>
<line x1="340" y1="511" x2="340" y2="533"/>
<line x1="340" y1="591" x2="340" y2="628"/>
</g>
<g stroke-width="1.25" fill="none" stroke-dasharray="5 4" marker-end="url(#a)">
<path d="M412 483 L605 483 L605 318 L592 318" stroke="#993C1D"/>
<path d="M248 658 L30 658 L30 318 L88 318" stroke="#0F6E56"/>
</g>

<g font-size="12" dominant-baseline="central">
<text x="348" y="225" fill="#5F5E5A">features f</text>
<text x="168" y="225" fill="#5F5E5A">y0 (step 1)</text>
<text x="505" y="473" fill="#993C1D" text-anchor="middle">z_t+1</text>
<text x="140" y="646" fill="#0F6E56" text-anchor="middle">y_t+1 feeds back</text>
<text x="40" y="720" fill="#5F5E5A">Gray = frozen baseline. Teal = trained refiner. Dashed = loops back each step.</text>
</g>
</svg>
